# One box, one SQLite file per app under /data/sqlite, all of them backed up
# by a single Litestream container. Apps know nothing about backups.
#
# Order on a fresh box: restore pulls any database missing from the bucket,
# then litestream and the apps start. Every step is safe to rerun.

x-litestream: &litestream
  image: litestream/litestream:0.5
  env_file: env/litestream.env
  volumes:
    - ./litestream.yml:/etc/litestream.yml:ro
    - /data/sqlite:/data/sqlite

x-app: &app
  restart: unless-stopped
  volumes:
    - /data/sqlite:/data/sqlite
  depends_on:
    restore:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN
    volumes:
      # Written by Pulumi (src/pulumi/caddy.py), like dex.json below.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Sign-in in front of every app. Dex offers Google and Microsoft, oauth2-proxy
  # keeps the session and Caddy asks it on every request. The cookie is set on
  # .DOMAIN, so one sign-in covers every subdomain.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    restart: unless-stopped
    env_file: env/auth.env
    command: dex serve /etc/dex/config.json
    volumes:
      - ./dex.json:/etc/dex/config.json:ro
      - ./dex-web:/srv/dex/web:ro

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    env_file: env/auth.env
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN}/dex
      # Reach Dex inside the compose network instead of out and back in.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN}/dex/auth
      OAUTH2_PROXY_REDEEM_URL: http://dex:5556/dex/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://dex:5556/dex/keys
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # The default, "force", makes Dex show its approval screen on every login.
      OAUTH2_PROXY_APPROVAL_PROMPT: auto
      # Who may sign in at all; the Caddyfile narrows it per app. Never add
      # email domains next to it: oauth2-proxy lets in anyone matching either,
      # and "*" matches everyone.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails
      # Its error page, styled like the Dex pages (src/pulumi/auth-web).
      OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR: /etc/oauth2-proxy/templates
      OAUTH2_PROXY_FOOTER: auth.${DOMAIN}
      # Caddy copies the signed-in email from the auth reply to the app.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
    volumes:
      - ./allowed-emails:/etc/oauth2-proxy/allowed-emails:ro
      - ./auth-web:/etc/oauth2-proxy/templates:ro

  restore:
    <<: *litestream
    entrypoint: /bin/sh -c
    command: >
      "for db in cadence; do
         litestream restore -if-db-not-exists -if-replica-exists /data/sqlite/$$db.db || exit 1;
       done"

  litestream:
    <<: *litestream
    restart: unless-stopped
    command: replicate
    depends_on:
      restore:
        condition: service_completed_successfully

  cadence:
    <<: *app
    image: ghcr.io/danielkjellid/cadence:latest
    env_file: env/cadence.env
    environment:
      SQLITE_PATH: /data/sqlite/cadence.db
      ALLOWED_HOSTS: cadence.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://cadence.${DOMAIN}
      # Logging out of Cadence must end the proxy session too, or the next
      # request signs the user straight back in.
      LOGOUT_REDIRECT_URL: https://auth.${DOMAIN}/oauth2/sign_out?rd=https://cadence.${DOMAIN}/

volumes:
  caddy_data:
  caddy_config:
