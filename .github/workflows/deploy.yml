name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy config and converge
        run: |
          rsync -az compose.yml litestream.yml bin "deploy@${{ secrets.DEPLOY_HOST }}:/srv/infra/"
          ssh "deploy@${{ secrets.DEPLOY_HOST }}" /srv/infra/bin/deploy.sh
