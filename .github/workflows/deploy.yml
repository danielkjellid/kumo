name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The files Pulumi writes on the box (Caddyfile, env files, Dex pages)
      # must already match this commit, or the new compose.yml can start
      # against old ones. Stop here until `kumo commit` has been run.
      - uses: astral-sh/setup-uv@v6
      - name: Check that kumo commit has nothing left to apply
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: danielkjellid-org/kumo/prod
          expect-no-changes: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy config and converge
        run: |
          rsync -az compose.yml litestream.yml bin "deploy@${{ secrets.DEPLOY_HOST }}:/srv/infra/"
          ssh "deploy@${{ secrets.DEPLOY_HOST }}" /srv/infra/bin/deploy.sh
