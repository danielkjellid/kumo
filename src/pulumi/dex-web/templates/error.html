{{ template "header.html" . }}

  <section class="head">
    <span class="badge">{{ .ErrType }}</span>
    <h1>Sign-in didn’t work</h1>
    <p class="sub">Something went wrong between {{ issuer }} and your sign-in provider. Go back to the app you were opening and try again.</p>
  </section>

  <section aria-label="Error details">
    <dl class="details" id="details">
      <div><dt>Status</dt><dd>{{ .ErrType }}</dd></div>
      <div><dt>Reason</dt><dd>{{ .ErrMsg }}</dd></div>
      <div><dt>Path</dt><dd>{{ .ReqPath }}</dd></div>
      <div><dt>Time</dt><dd id="time">–</dd></div>
    </dl>

    <div class="actions">
      <button class="btn btn-secondary" type="button" id="copy">
        <svg class="cp" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>
        <svg class="ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"/></svg>
        <span id="copy-label">Copy details</span>
      </button>
    </div>
  </section>

<script>
  document.getElementById('time').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  const copy = document.getElementById('copy');
  const label = document.getElementById('copy-label');
  copy.addEventListener('click', async () => {
    const text = [...document.querySelectorAll('#details div')]
      .map(r => `${r.querySelector('dt').textContent}: ${r.querySelector('dd').textContent}`).join('\n');
    try { await navigator.clipboard.writeText(text); label.textContent = 'Copied'; }
    catch { label.textContent = 'Copy failed, select the details above'; }
    copy.classList.toggle('copied', label.textContent === 'Copied');
    setTimeout(() => { label.textContent = 'Copy details'; copy.classList.remove('copied'); }, 2000);
  });
</script>

{{ template "footer.html" . }}
